<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Half Pour: a cheer</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Nothing paints the ground: this one is rendered with an alpha channel and laid over the page. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      .layer { position: absolute; inset: 0; }
      .fall { position: absolute; width: 0; height: 0; }
      .fly { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .bit { position: absolute; border: 4px solid #1F1A3D; }
      #jumper { position: absolute; left: 250px; top: 512px; width: 580px; height: 580px; transform-origin: 50% 88%; }
      #jumper img { position: absolute; left: 0; top: 0; width: 580px; height: 580px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-width="1080" data-height="1080" data-layout-allow-overlap>
      <div id="confetti-back" class="layer" data-layout-allow-overflow></div>
      <div id="stage" class="layer">
        <div id="jumper" data-layout-allow-overflow>
          <img class="frame" src="assets/web-sheet-cheer-1-720.webp" alt="" />
          <img class="frame" src="assets/web-sheet-cheer-2-720.webp" alt="" />
          <img class="frame" src="assets/web-sheet-cheer-3-720.webp" alt="" />
          <img class="frame" src="assets/web-sheet-cheer-4-720.webp" alt="" />
          <img class="frame" src="assets/web-sheet-cheer-5-720.webp" alt="" />
          <img class="frame" src="assets/web-sheet-cheer-6-720.webp" alt="" style="transform: translateY(-8px) scale(0.95); transform-origin: 50% 91%" />
        </div>
      </div>
      <div id="confetti-front" class="layer" data-layout-allow-overflow></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });

        // A small seeded generator, so every render and every playback throws the same confetti.
        let seed = 61120261;
        const rand = function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = function (a, b) { return a + (b - a) * rand(); };

        const COLOURS = ["#1FC98A", "#9B7BF7", "#FF6FA3", "#FFF6E5"];
        const SHAPES = [
          { w: 50, h: 26, r: 9 },
          { w: 28, h: 50, r: 9 },
          { w: 34, h: 34, r: 9 },
          { w: 30, h: 30, r: 15 },
        ];
        const PER_SIDE = 24;
        const back = document.getElementById("confetti-back");
        const front = document.getElementById("confetti-front");

        // Two cannons in the bottom corners, firing up and in.
        [-1, 1].forEach(function (side) {
          for (let i = 0; i < PER_SIDE; i++) {
            const shape = SHAPES[(i + (side > 0 ? 2 : 0)) % SHAPES.length];
            const fall = document.createElement("div");
            fall.className = "fall";
            fall.style.left = (side < 0 ? -20 : 1100) + "px";
            fall.style.top = "1100px";
            const bit = document.createElement("div");
            bit.className = "bit";
            bit.style.width = shape.w + "px";
            bit.style.height = shape.h + "px";
            bit.style.left = -shape.w / 2 + "px";
            bit.style.top = -shape.h / 2 + "px";
            bit.style.borderRadius = shape.r + "px";
            bit.style.background = COLOURS[(i * 5 + (side > 0 ? 1 : 0)) % COLOURS.length];
            const fly = document.createElement("div");
            fly.className = "fly";
            fly.appendChild(bit);
            fall.appendChild(fly);
            (i % 3 === 0 ? front : back).appendChild(fall);

            const across = between(90, 640) * -side;
            const height = between(430, 1010);
            const at = 0.38 + between(0, 0.14);
            const up = between(0.6, 0.78);
            const spin = between(-1, 1) > 0 ? between(240, 520) : between(-520, -240);

            gsap.set(bit, { rotation: between(-40, 40) });
            tl.to(fly, { x: across, duration: 1.7, ease: "power2.out" }, at);
            tl.to(fly, { y: -height, duration: up, ease: "power2.out" }, at);
            tl.to(bit, { rotation: "+=" + spin, duration: 1.8, ease: "power1.out" }, at);
            // Gravity takes over and they leave through the bottom.
            tl.to(fall, { y: height + 140, duration: 1.0, ease: "power2.in" }, at + up - 0.06);
            tl.to(fall, { opacity: 0, duration: 0.26, ease: "power1.in" }, at + up + 0.68);
          }
        });

        // Pourie comes up from below, jumps once through the six drawn frames, and drops back out.
        const frames = gsap.utils.toArray(".frame");
        const show = function (index, at) {
          frames.forEach(function (frame, i) {
            tl.set(frame, { opacity: i === index ? 1 : 0 }, at);
          });
        };
        gsap.set(frames, { opacity: 0 });
        gsap.set(frames[0], { opacity: 1 });
        gsap.set("#jumper", { y: 640 });

        tl.to("#jumper", { y: 0, duration: 0.3, ease: "power3.out" }, 0);
        show(1, 0.28);
        tl.to("#jumper", { scaleY: 0.92, scaleX: 1.05, duration: 0.12, ease: "power2.out" }, 0.28);
        show(2, 0.42);
        tl.to("#jumper", { scaleY: 1.04, scaleX: 0.97, duration: 0.1, ease: "power2.out" }, 0.4);
        tl.to("#jumper", { y: -170, duration: 0.3, ease: "power2.out" }, 0.4);
        show(3, 0.56);
        tl.to("#jumper", { scaleY: 1, scaleX: 1, duration: 0.2, ease: "power1.out" }, 0.56);
        tl.to("#jumper", { y: 0, duration: 0.28, ease: "power2.in" }, 0.76);
        show(4, 0.86);
        show(5, 1.04);
        tl.to("#jumper", { scaleY: 0.93, scaleX: 1.05, duration: 0.08, ease: "power2.out" }, 1.04);
        tl.to("#jumper", { scaleY: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 1.12);
        show(0, 1.42);
        tl.to("#jumper", { y: 660, duration: 0.42, ease: "power3.in" }, 1.6);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
