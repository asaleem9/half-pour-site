<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Half Pour: a badge lands</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Nothing paints the ground: this one is rendered with an alpha channel and laid over the page. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      .layer { position: absolute; inset: 0; }
      .fall { position: absolute; left: 540px; top: 540px; width: 0; height: 0; }
      .fly { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .bit { position: absolute; border: 4px solid #1F1A3D; }
      #badge { position: absolute; left: 372px; top: 324px; width: 336px; height: 432px; display: block; transform-origin: 50% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-width="1080" data-height="1080" data-layout-allow-overlap>
      <div id="confetti" class="layer" data-layout-allow-overflow></div>
      <div id="stage" class="layer"><img id="badge" src="assets/badge-closed-the-tab-400.webp" alt="" /></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const tl = gsap.timeline({ paused: true });

        // A small seeded generator, so every render and every playback throws the same confetti.
        let seed = 20261110;
        const rand = function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = function (a, b) { return a + (b - a) * rand(); };

        const COLOURS = ["#1FC98A", "#9B7BF7", "#FF6FA3", "#FFF6E5"];
        const SHAPES = [
          { w: 50, h: 26, r: 9 },
          { w: 28, h: 50, r: 9 },
          { w: 34, h: 34, r: 9 },
          { w: 30, h: 30, r: 15 },
        ];
        const COUNT = 32;
        const holder = document.getElementById("confetti");

        for (let i = 0; i < COUNT; i++) {
          const shape = SHAPES[i % SHAPES.length];
          const fall = document.createElement("div");
          fall.className = "fall";
          const bit = document.createElement("div");
          bit.className = "bit";
          bit.style.width = shape.w + "px";
          bit.style.height = shape.h + "px";
          bit.style.left = -shape.w / 2 + "px";
          bit.style.top = -shape.h / 2 + "px";
          bit.style.borderRadius = shape.r + "px";
          bit.style.background = COLOURS[(i * 7 + 3) % COLOURS.length];
          const fly = document.createElement("div");
          fly.className = "fly";
          fly.appendChild(bit);
          fall.appendChild(fly);
          holder.appendChild(fall);

          // A ring: evenly spread angles with a little wobble, two distances so it reads as depth.
          const angle = (i / COUNT) * Math.PI * 2 + between(-0.09, 0.09);
          const reach = (i % 2 ? between(300, 380) : between(410, 500));
          const at = 0.2 + between(0, 0.07);
          const spin = between(-1, 1) > 0 ? between(200, 420) : between(-420, -200);
          const drop = between(560, 760);

          gsap.set(bit, { scale: 0, rotation: between(-40, 40) });
          tl.to(bit, { scale: 1, duration: 0.16, ease: "power2.out" }, at);
          tl.to(fly, { x: Math.cos(angle) * reach, y: Math.sin(angle) * reach - 40, duration: 0.85, ease: "power3.out" }, at);
          tl.to(bit, { rotation: "+=" + spin, duration: 1.75, ease: "power1.out" }, at);
          // Then it falls away and is gone before the end.
          tl.to(fall, { y: drop, duration: 1.05, ease: "power2.in" }, at + 0.62);
          tl.to(fall, { opacity: 0, duration: 0.3, ease: "power1.in" }, at + 1.38);
        }

        // The badge spins in at the centre, sits, and tucks away.
        gsap.set("#badge", { scale: 0, rotation: -200 });
        tl.to("#badge", { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.04);
        tl.to("#badge", { y: -14, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.7);
        tl.to("#badge", { scale: 0, rotation: 30, duration: 0.36, ease: "power3.in" }, 1.72);
        tl.to("#badge", { opacity: 0, duration: 0.12, ease: "power1.in" }, 1.96);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
